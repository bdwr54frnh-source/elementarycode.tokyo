<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELEMENTARY CODE 漫画 LIVE時計 確認用</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#061221;overflow-x:hidden}main{position:relative;width:100%;}img{display:block;width:100%;height:auto;}#clock{position:absolute;left:38.1%;top:30.4%;width:12.9%;height:3.0%;display:flex;align-items:center;justify-content:center;background:#081b3c;color:#fff;font:700 clamp(4px,1.55vw,28px)/1 Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.04em;white-space:nowrap;pointer-events:none}</style></head><body>
<main><img src="elementary_code_correct_8panel.png" alt="ELEMENTARY CODEってなに？ 8コマ漫画"><time id="clock" aria-label="東京時刻 LIVE">12:34:56.78</time></main>
<script>(()=>{const el=document.getElementById('clock');const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});function tick(){const n=new Date();el.textContent=fmt.format(n)+'.'+String(Math.floor(n.getMilliseconds()/10)).padStart(2,'0')}tick();setInterval(tick,10)})();</script>
</body></html>
