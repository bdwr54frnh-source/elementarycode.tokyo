<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELEMENTARY CODE 工場見学</title><style>*{box-sizing:border-box}body{margin:0;background:#f9f3e7;color:#24252b;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif}.wrap{max-width:560px;margin:auto;padding:12px 10px}h1{text-align:center;font-size:22px}.intro{background:white;border:3px solid #24252b;border-radius:18px;padding:10px;margin:10px auto 12px;max-width:740px}.factory{background:#d9efff;border:4px solid #24252b;border-radius:24px;padding:10px;overflow:hidden}.lines{display:grid;grid-template-columns:1fr 1fr;gap:16px}.line{background:#fff9e9;border:3px solid #24252b;border-radius:16px;text-align:center;padding:14px 8px;min-width:0}.drum{height:86px;max-width:140px;margin:6px auto;position:relative;background:#e6a44f;border:5px solid #24252b;border-radius:18px 18px 30px 30px;overflow:hidden;box-shadow:inset 0 20px #f6c883,inset 0 -20px #bf7c31}.drum:before,.drum:after{content:"";position:absolute;left:0;right:0;height:8px;background:#34383c}.drum:before{top:37px}.drum:after{bottom:35px}.items{position:absolute;inset:8px 10px;display:flex;flex-wrap:wrap;align-content:end;justify-content:center;gap:4px;font-size:16px;line-height:1.1}.item{animation:drop .4s ease-out both}@keyframes drop{from{transform:translateY(-28px);opacity:0}to{transform:translateY(0);opacity:1}}.number{font-size:clamp(20px,4vw,28px);font-weight:900;font-variant-numeric:tabular-nums}.small{font-size:14px}.note{font-size:13px;line-height:1.6}.footer{text-align:center;margin-top:18px}@media(max-width:480px){.lines{gap:8px}.line{padding:9px 4px}.drum{height:78px}.items{font-size:14px}}@media(prefers-reduced-motion:reduce){.item{animation:none}}</style><main class="wrap"><h1>ELEMENTARY CODE 工場見学</h1><section class="intro"><strong>① おじさんのお話</strong><p>子供たちは体育座り。「工場を見てみよう！」</p></section><section class="factory" id="factory"><div class="lines"><div class="line"><h2>② 鍵のドラム缶</h2><div class="drum" aria-hidden="true"><div class="items" id="keys"></div></div><div class="number" id="key-count">--</div><div class="small">鍵・完成個数</div></div><div class="line"><h2>③ シリンダーのドラム缶</h2><div class="drum" aria-hidden="true"><div class="items" id="cylinders"></div></div><div class="number" id="cylinder-count">--</div><div class="small">シリンダー・完成個数</div></div></div><p class="footer" id="speed">④ できあがりの速さ：計測データ確認中</p></section><p class="note">漫画の製造風景はイメージです。個数・速度は計測APIが提供する実測値のみ表示し、未接続時は「--」と表示します。秘密の生成・認証ロジックは公開しません。</p><p><a href="/">公式サイトへ戻る</a></p></main><script>const $=id=>document.getElementById(id);let running=false,timer=null,previous={keys:null,cylinders:null};function draw(id,symbol,count){const node=$(id);node.replaceChildren();const amount=Math.min(24,Math.max(0,count%25));for(let i=0;i<amount;i++){const el=document.createElement('span');el.className='item';el.textContent=symbol;node.append(el)}}async function refresh(){try{const res=await fetch('/api/public-metrics',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!res.ok)throw Error('offline');const d=await res.json();if(d.source!=='measured'||d.location!=='Tokyo'||!Number.isSafeInteger(d.keys_completed)||!Number.isSafeInteger(d.cylinders_completed)||d.keys_completed<0||d.cylinders_completed<0)throw Error('invalid');$('key-count').textContent=d.keys_completed.toLocaleString('ja-JP');$('cylinder-count').textContent=d.cylinders_completed.toLocaleString('ja-JP');if(previous.keys!==d.keys_completed){draw('keys','🔑',d.keys_completed);previous.keys=d.keys_completed}if(previous.cylinders!==d.cylinders_completed){draw('cylinders','⚙️',d.cylinders_completed);previous.cylinders=d.cylinders_completed}const k=Number.isSafeInteger(d.keys_per_second)?d.keys_per_second:null,c=Number.isSafeInteger(d.cylinders_per_second)?d.cylinders_per_second:null;$('speed').textContent=k!==null&&c!==null?'鍵 '+k.toLocaleString('ja-JP')+' 個/秒 ｜ シリンダー '+c.toLocaleString('ja-JP')+' 個/秒':'稼働数値を取得中'}catch{$('key-count').textContent='--';$('cylinder-count').textContent='--';$('speed').textContent='実測データ未接続'}}const observer=new IntersectionObserver(entries=>{const visible=entries[0].isIntersecting;if(visible&&!running){running=true;refresh();timer=setInterval(refresh,1000)}else if(!visible&&running){running=false;clearInterval(timer)}},{rootMargin:'180px'});observer.observe($('factory'));</script></html>
