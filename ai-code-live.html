<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI CODE LIVE</title><style>body{background:#070b12;color:#f1f5fa;font-family:system-ui,sans-serif;margin:0;padding:24px}.panel{max-width:680px;margin:auto;border:1px solid #8393a6;border-radius:16px;padding:26px;background:#111b2a}h1{font-size:26px}.value{font-variant-numeric:tabular-nums;font-size:clamp(38px,8vw,68px);font-weight:800}.muted{color:#afbdcc}a{color:#b9e6ff}</style><main class="panel"><h1>AI CODE | LIVE</h1><p class="muted">東京拠点・生成処理の公開計測窓</p><div class="value" id="rate">--</div><p>件／秒</p><p id="status" class="muted" role="status">稼働状況を確認中</p><p class="muted">表示は計測APIの実測値のみ。秘密のコード・認証鍵・生成規則は表示しません。</p><a href="/">公式サイトへ戻る</a></main><script>const rate=document.getElementById('rate'),status=document.getElementById('status');async function refresh(){try{const response=await fetch('/api/public-metrics',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!response.ok)throw Error('unavailable');const data=await response.json();if(!Number.isSafeInteger(data.generated_per_second)||data.generated_per_second<0||data.location!=='Tokyo'||data.source!=='measured')throw Error('invalid');rate.textContent=data.generated_per_second.toLocaleString('ja-JP');status.textContent='実測値（直近1秒）';}catch{rate.textContent='--';status.textContent='計測値を取得できません';}}setTimeout(()=>{refresh();setInterval(refresh,1000)},1000);</script></html>
